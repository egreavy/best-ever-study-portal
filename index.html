<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Portal</title>
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#f3f1ec;color:#232323;min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .wrap{text-align:center;}
  h1{font-size:26px;margin:0 0 24px;font-weight:800;}
  .row{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;}
  a.card{width:160px;background:#fff;border:1px solid #e6e3da;border-radius:20px;padding:24px 12px;text-decoration:none;color:#232323;display:block;}
  a.card:hover{border-color:#0f6e5c;}
  .avatar{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:24px;}
  .name{font-weight:800;font-size:16px;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>Who's studying?</h1>
    <div class="row">
      <a class="card" href="annabel.html">
        <div class="avatar" style="background:#ec4899">A</div>
        <div class="name">Annabel</div>
      </a>
      <a class="card" href="daniel.html">
        <div class="avatar" style="background:#3b82f6">D</div>
        <div class="name">Daniel</div>
      </a>
    </div>
  </div>
</body>
</html>
