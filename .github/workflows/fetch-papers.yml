name: fetch-papers
on:
  push:
    branches: [main]
    paths: [papers.txt, .github/workflows/fetch-papers.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download papers to the papers branch
        run: |
          git init -q p && cd p
          git config user.name "fetch-bot"; git config user.email "fetch-bot@users.noreply.github.com"
          git checkout -q -b papers
          curl -sfL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/papers.txt" -o list.txt
          while read name url; do curl -sfL --retry 3 "$url" -o "$name.pdf" || echo "FAILED $name" >> failed.txt; done < list.txt
          ls -la
          git add -A && git commit -qm "Exam papers" 
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" papers
