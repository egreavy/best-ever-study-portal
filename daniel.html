<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daniel's Study Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="theme.js?v=20261022k" data-profile="8d1d2f44-c93b-4fa4-9e15-dac1e4586623"></script>
<script src="stickers.js?v=20261022k"></script>
<script src="rewards.js?v=20261022k" data-profile="8d1d2f44-c93b-4fa4-9e15-dac1e4586623"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  :root{
    color-scheme: light;
    --ink:#232323;
    --sub:#6b6b64;
    --accent:#0f6e5c;
    --accent-soft:#dcefe7;
    --profile:#3b82f6;
    --green:#1a7d4a;
    --track:#e6e1d2;
    --card-border:#e6e3da;
    --bg:#f3f1ec;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
    line-height:1.55;
    letter-spacing:0.1px;
  }
  .wrap{max-width:820px;margin:0 auto;padding:24px 18px 60px;}

  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
    flex-wrap:wrap;
    gap:10px;
  }
  .brand{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px;}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);}

  .profile-pill{
    display:flex;align-items:center;gap:8px;
    background:var(--t-card);border:1px solid var(--card-border);
    padding:6px 12px;border-radius:999px;
  }
  .avatar{
    width:28px;height:28px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--t-on-accent);font-weight:800;font-size:13px;
    background:var(--profile);
  }

  #view{}

  .crumb{color:var(--sub);font-size:13px;margin-bottom:14px;cursor:pointer;}
  .crumb span{cursor:pointer;color:var(--accent);font-weight:700;}
  .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 16px;flex-wrap:wrap;}
  .section-title{font-size:22px;font-weight:800;margin:0;}
  .refresh-btn{
    border:1px solid var(--card-border);background:var(--t-card);color:var(--accent);
    font-size:12px;font-weight:700;padding:7px 14px;border-radius:999px;cursor:pointer;
  }
  .refresh-btn:hover{background:var(--track);}

  .subject-card{
    background:var(--t-card);border:1px solid var(--card-border);border-radius:18px;
    padding:18px 20px;margin-bottom:14px;
  }
  .subject-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:0;cursor:pointer;user-select:none;}
  .subject-card.expanded .subject-head{margin-bottom:10px;}
  .subject-head-left{display:flex;align-items:center;gap:10px;}
  .subject-head h3{margin:0;font-size:17px;font-weight:800;}
  .subject-head p{margin:2px 0 0;color:var(--sub);font-size:13px;}
  .subject-count{
    font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);
    padding:3px 10px;border-radius:999px;flex:0 0 auto;
  }
  .subject-chevron{
    flex:0 0 auto;color:var(--sub);font-size:14px;transition:transform .15s ease;
  }
  .subject-card.expanded .subject-chevron{transform:rotate(90deg);}
  .subject-chapters{display:none;}
  .subject-card.expanded .subject-chapters{display:block;}

  .chapter-row{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 14px;
    padding:11px 14px;border-radius:12px;background:var(--bg);
    margin-top:8px;cursor:pointer;border:1px solid transparent;
  }
  .chapter-row:hover{border-color:var(--card-border);}
  .chapter-row .left{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 180px;}
  .chapter-num{
    width:28px;height:28px;border-radius:9px;background:var(--accent);color:var(--t-on-accent);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;flex:0 0 auto;
  }
  .chapter-title{font-weight:700;font-size:14px;}
  .mini-track{width:56px;height:7px;background:var(--track);border-radius:999px;overflow:hidden;flex:0 0 auto;}
  .mini-fill{height:100%;background:var(--accent);}
  .mini-count{font-size:11.5px;color:var(--sub);font-weight:700;}
  .chapter-row .row-right{
    display:flex;align-items:center;gap:9px;flex:0 0 auto;
  }
  .chapter-note-input{
    flex:0 0 100%;width:100%;border:none;border-bottom:1px solid var(--card-border);
    background:transparent;font-size:12.5px;color:var(--ink);padding:5px 2px;outline:none;
    margin-top:2px;cursor:text;
  }
  .chapter-note-input::placeholder{color:var(--sub);}
  .chapter-note-input:focus{border-bottom-color:var(--t-accent);}

  .empty{color:var(--sub);font-size:14px;padding:10px 4px;}
  .error-box{
    color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:14px;
    padding:16px 18px;font-size:13.5px;line-height:1.5;
  }
  .error-box strong{display:block;margin-bottom:4px;font-size:14.5px;}
  .error-box code{display:block;margin-top:6px;background:var(--t-card);border:1px solid #fecaca;border-radius:8px;padding:8px 10px;font-size:12px;white-space:pre-wrap;word-break:break-word;}
  .retry-btn{
    margin-top:12px;border:none;background:#b91c1c;color:var(--t-on-accent);font-size:12px;font-weight:700;
    padding:7px 14px;border-radius:9px;cursor:pointer;
  }

  .chapter-header{
    background:var(--t-card);border:1px solid var(--card-border);border-radius:18px;
    padding:20px 22px;margin-bottom:20px;
  }
  .chapter-eyebrow{margin:0 0 6px;color:var(--sub);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;}
  .chapter-header h2{margin:0 0 4px;font-size:20px;font-weight:800;}
  .notebook-link{
    display:inline-flex;align-items:center;gap:6px;margin-top:10px;
    background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;
    padding:7px 14px;border-radius:999px;text-decoration:none;
  }
  .progress-top{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin:14px 0 8px;}
  .progress-top .count{color:var(--accent);}
  .track{height:10px;background:var(--track);border-radius:999px;overflow:hidden;}
  .fill{height:100%;width:0%;border-radius:999px;background:var(--accent);transition:width .3s ease;}
  .celebrate{display:none;margin-top:10px;text-align:center;font-weight:800;color:var(--green);font-size:14px;}
  .celebrate.show{display:block;}

  .steps{display:flex;flex-direction:column;gap:12px;}
  .step{
    background:var(--t-card);border-radius:16px;padding:16px 20px;
    border:1px solid var(--card-border);
  }
  .step.collapsed{cursor:pointer;transition:border-color .15s ease;}
  .step.collapsed:hover{border-color:var(--accent);}
  .step.expanded{border:2px solid var(--accent);padding:17px 19px;}
  .step.done .step-title{text-decoration:line-through;text-decoration-color:var(--sub);}
  .step-head{display:flex;align-items:flex-start;gap:12px;}
  .num{
    flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--stepcolor,var(--track));
    color:var(--t-on-accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;
  }
  .step.done .num{background:var(--green);color:var(--t-on-accent);}
  .step-body{flex:1;}
  .step-title{margin:0;font-size:16px;font-weight:800;}
  .step-blurb{margin:2px 0 0;color:var(--sub);font-size:13px;}
  .check{
    flex:0 0 auto;width:30px;height:30px;border-radius:9px;border:2.5px solid var(--card-border);
    cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;
    color:transparent;background:var(--t-card);transition:background .15s ease,border-color .15s ease,transform .1s ease;
  }
  .step.expanded .check{border-color:var(--accent);}
  .check:hover{background:var(--accent-soft);border-color:var(--accent);}
  .check:active{transform:scale(.92);}
  .step.done .check{background:var(--green);border-color:var(--green);color:var(--t-on-accent);}
  @keyframes popCheck{0%{transform:scale(.7);}55%{transform:scale(1.2);}100%{transform:scale(1);}}
  .check.just-checked{animation:popCheck .35s ease;}

  .reveal{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s ease;}
  .reveal.in{opacity:1;transform:translateY(0);}

  .actions{margin-top:14px;display:flex;flex-direction:column;gap:14px;}
  .action-instruction{margin:0 0 8px;font-size:13.5px;color:var(--ink);}
  .prompt-box{background:var(--bg);border:1px solid var(--card-border);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;}
  .prompt-text{font-size:13.5px;line-height:1.55;color:var(--ink);}
  .copy-btn{flex:0 0 auto;border:none;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;padding:6px 10px;border-radius:9px;cursor:pointer;}
  .copy-btn.copied{background:var(--green);color:var(--t-on-accent);}
  .prompt-accordion{border:1px solid var(--card-border);border-radius:12px;background:var(--bg);overflow:hidden;}
  .prompt-accordion summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;font-size:12.5px;font-weight:700;color:var(--sub);user-select:none;}
  .prompt-accordion summary::-webkit-details-marker{display:none;}
  .prompt-accordion summary .chev{transition:transform .15s ease;font-size:11px;color:var(--sub);}
  .prompt-accordion[open] summary .chev{transform:rotate(180deg);}
  .prompt-accordion[open] summary{border-bottom:1px solid var(--card-border);}
  .prompt-accordion .prompt-box{border:none;border-radius:0;}
  .make-video-btn{
    border:none;background:var(--accent);color:var(--t-on-accent);font-size:13px;font-weight:700;
    padding:9px 18px;border-radius:999px;cursor:pointer;
  }
  .make-video-btn.queued{background:var(--track);color:var(--sub);cursor:default;}
  .make-video-btn.secondary{background:var(--accent-soft);color:var(--accent);font-size:12.5px;padding:7px 14px;}
  .cancel-video-btn{
    border:none;background:none;color:var(--sub);font-size:12px;text-decoration:underline;
    cursor:pointer;margin-left:10px;padding:0;
  }
  .done-link{margin-top:8px;font-size:13px;}
  .done-link a{color:var(--accent);font-weight:700;text-decoration:none;}
  .done-link .change-btn{margin-left:8px;border:none;background:none;color:var(--sub);font-size:11.5px;text-decoration:underline;cursor:pointer;padding:0;}
  .done-link.primary{margin-top:0;background:var(--accent-soft);border-radius:12px;padding:10px 12px;display:flex;align-items:center;}
  .done-link.primary a{font-size:13.5px;}
  .link-form{margin-top:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .link-form input{flex:1;min-width:160px;border:1px solid var(--card-border);border-radius:9px;padding:6px 10px;font-size:13px;}
  .link-form button{flex:0 0 auto;border:none;background:var(--accent);color:var(--t-on-accent);font-size:12px;font-weight:700;padding:6px 12px;border-radius:9px;cursor:pointer;}
  .skip-link{display:inline-block;margin-top:10px;color:var(--sub);font-size:12.5px;text-decoration:underline;cursor:pointer;}
  .skip-link:hover{color:var(--ink);}

  .confidence-card{
    background:var(--t-card);border:1px solid var(--card-border);border-radius:18px;
    padding:20px 22px;margin-top:20px;
  }
  .confidence-card h3{margin:0 0 4px;font-size:16px;font-weight:800;}
  .confidence-card .sub{margin:0 0 16px;color:var(--sub);font-size:13px;}
  .confidence-row{display:flex;align-items:center;gap:16px;}
  .confidence-value{
    flex:0 0 auto;color:var(--accent);font-weight:800;font-size:22px;
    display:flex;align-items:baseline;gap:2px;min-width:44px;justify-content:flex-end;
  }
  .confidence-value .max{color:var(--sub);font-weight:700;font-size:13px;}
  .confidence-slider{
    flex:1;-webkit-appearance:none;appearance:none;height:8px;border-radius:999px;
    background:var(--track);outline:none;cursor:pointer;
  }
  .confidence-slider::-webkit-slider-thumb{
    -webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--t-card);
    cursor:pointer;border:3px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.25);
  }
  .confidence-slider::-moz-range-thumb{
    width:24px;height:24px;border-radius:50%;background:var(--t-card);
    cursor:pointer;border:3px solid var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.25);
  }
  .confidence-labels{display:flex;justify-content:space-between;font-size:11.5px;color:var(--sub);margin-top:8px;}
  .confidence-saved{font-size:12px;color:var(--green);font-weight:700;margin-top:10px;height:16px;opacity:0;transition:opacity .2s ease;}
  .confidence-saved.show{opacity:1;}

  .loading{color:var(--sub);text-align:center;padding:40px 0;}

  /* ---- Chapter phases: Learn / Test / Track ---- */
  .phase{margin-top:26px;}
  .phase-head{display:flex;align-items:flex-start;gap:12px;margin:0 0 12px;}
  .phase-num{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--t-on-accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;}
  .phase-head h3{margin:0;font-size:19px;font-weight:800;}
  .phase-head p{margin:2px 0 0;color:var(--sub);font-size:13.5px;}
  .phase-empty{background:var(--t-card);border:1px dashed var(--card-border);border-radius:16px;padding:16px 18px;color:var(--sub);font-size:14px;}
  .extra-practice{margin-top:12px;background:var(--t-card);border:1px solid var(--card-border);border-radius:16px;padding:14px 18px;}
  .extra-practice summary{cursor:pointer;font-weight:800;font-size:14.5px;}
  .extra-practice .steps{margin-top:12px;}
  .progress-top .count.know{color:var(--green);}

  /* ---- Up Next (flagged chapters) ---- */
  .upnext-wrap{margin-bottom:22px;display:flex;flex-direction:column;gap:14px;}
  .upnext-group h4{margin:0 0 8px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--sub);}
  .upnext-card{
    background:var(--t-card);border:1px solid var(--card-border);border-left:4px solid var(--t-accent);
    border-radius:14px;padding:12px 16px;margin-bottom:8px;cursor:pointer;
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  }
  .upnext-card:hover{border-color:var(--t-accent);}
  .upnext-main{flex:1;min-width:160px;}
  .upnext-title{font-weight:800;font-size:14.5px;margin:0;}
  .upnext-sub{font-size:12px;color:var(--sub);margin:2px 0 0;}
  .upnext-note-input{
    font-size:12.5px;color:var(--ink);margin-top:6px;background:var(--bg);border:1px solid transparent;
    border-radius:8px;padding:5px 9px;width:100%;max-width:280px;outline:none;cursor:text;
  }
  .upnext-note-input::placeholder{color:var(--sub);}
  .upnext-note-input:focus{border-color:var(--t-accent);background:var(--t-card);}
  .upnext-meta{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
  .upnext-remove{
    flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:none;background:transparent;
    color:var(--sub);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .15s ease,color .15s ease;
  }
  .upnext-remove:hover{background:var(--track);color:var(--ink);}
  .conf-badge{
    font-size:11.5px;font-weight:800;color:var(--t-on-accent);background:var(--sub);
    border-radius:999px;padding:3px 9px;white-space:nowrap;
  }

  /* ---- Flag toggle pills on chapter rows ---- */
  .flag-pills{display:flex;gap:5px;flex:0 0 auto;}
  .flag-pill{
    border:1.5px solid var(--card-border);background:var(--t-card);color:var(--sub);
    font-size:10.5px;font-weight:800;padding:4px 8px;border-radius:999px;cursor:pointer;
    white-space:nowrap;
  }
  .flag-pill:hover{border-color:var(--flagcolor,var(--accent));}
  .flag-pill.active{background:var(--flagcolor,var(--accent));border-color:var(--flagcolor,var(--accent));color:var(--t-on-accent);}
  .flag-note-row{
    margin-top:6px;display:flex;gap:6px;align-items:center;width:100%;
  }
  .flag-note-row input{
    flex:1;border:1px solid var(--card-border);border-radius:8px;padding:5px 9px;font-size:12.5px;
  }
  .flag-note-row button{
    border:none;background:var(--accent);color:var(--t-on-accent);font-size:11.5px;font-weight:700;
    padding:5px 10px;border-radius:8px;cursor:pointer;
  }
  .chapter-row.flagged{
    border:1px solid var(--t-accent);
    border-left:4px solid var(--t-accent);
    background:var(--t-card);
  }
  .flag-icon-btn{
    width:26px;height:26px;border-radius:50%;border:1.5px solid var(--card-border);background:var(--t-card);color:var(--sub);
    font-size:15px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;
    flex:0 0 auto;line-height:1;padding:0;transition:background .15s ease,border-color .15s ease,color .15s ease;
  }
  .flag-icon-btn:hover{border-color:var(--t-accent);color:var(--t-accent);}
  .flag-icon-btn.active{background:var(--t-accent);border-color:var(--t-accent);color:var(--t-on-accent);}
  .subject-flag-badge{
    font-size:11px;font-weight:800;color:var(--t-on-accent);background:var(--t-accent);
    border-radius:999px;padding:3px 9px;white-space:nowrap;
  }
  .subject-head .row-right{gap:8px;flex:0 0 auto;}

  .settings-btn{
    width:36px;height:36px;border-radius:50%;border:1px solid var(--card-border);background:var(--t-card);
    color:var(--sub);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:background .15s ease,color .15s ease;
  }
  .settings-btn:hover{background:var(--track);color:var(--ink);}

  .settings-subject{
    background:var(--t-card);border:1px solid var(--card-border);border-radius:18px;
    padding:18px 20px;margin-bottom:14px;
  }
  .settings-subject h3{margin:0 0 2px;font-size:16px;font-weight:800;}
  .settings-subject .sub{margin:0 0 14px;color:var(--sub);font-size:13px;}
  .settings-step-row{
    display:flex;align-items:center;gap:12px;padding:10px 0;
    border-top:1px solid var(--card-border);
  }
  .settings-step-row:first-of-type{border-top:none;}
  .settings-step-emoji{font-size:18px;flex:0 0 auto;width:24px;text-align:center;}
  .settings-step-body{flex:1;}
  .settings-step-title{font-weight:700;font-size:14px;}
  .settings-step-title.disabled{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--sub);}
  .settings-step-blurb{font-size:12px;color:var(--sub);margin-top:1px;}
  .settings-toggle{
    flex:0 0 auto;width:42px;height:24px;border-radius:999px;border:none;cursor:pointer;
    background:var(--track);position:relative;transition:background .15s ease;
  }
  .settings-toggle.on{background:var(--green);}
  .settings-toggle .knob{
    position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--t-card);
    box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s ease;
  }
  .settings-toggle.on .knob{left:20px;}
  .settings-hint{color:var(--sub);font-size:13px;margin:0 0 18px;}

  /* ---- Chapter view: tabs (Progress / Learn / Test), calm palette, compact ---- */
  .cv{font-family:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;color:var(--t-ink);letter-spacing:.01em;}
  .cv .crumb{font-size:14px;margin-bottom:8px;}
  .cv .crumb span{color:var(--t-accent);font-weight:700;}
  .cv-title{margin:0 0 4px;font-size:23px;font-weight:700;line-height:1.25;text-wrap:balance;}
  .cv-meta{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-bottom:12px;}
  .cv-flag{border:none;background:none;padding:4px 0;font:inherit;font-size:14px;font-weight:700;color:var(--t-muted);cursor:pointer;}
  .cv-flag.active{color:var(--t-ink);}
  .cv-nb{font-size:14px;font-weight:700;color:var(--t-accent);}
  .cv .flag-note-row{margin:-4px 0 12px;}
  .cv-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--t-soft2);padding:4px;border-radius:12px;margin-bottom:14px;}
  .cv-tab{border:none;background:none;font:inherit;font-size:16px;font-weight:700;color:var(--t-muted);padding:8px 0;border-radius:9px;cursor:pointer;min-height:40px;}

function observeReveal(selector){
  const els = document.querySelectorAll(selector);
  if(!("IntersectionObserver" in window)){
    els.forEach(el => el.classList.add("in"));
    return;
  }
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        entry.target.classList.add("in");
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12 });
  els.forEach(el => io.observe(el));
}

function esc(s){ return (s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

async function sb(path, opts){
  opts = opts || {};
  lastError = null;
  try {
    const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, {
      method: opts.method || "GET",
      headers: Object.assign({
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + SUPABASE_KEY
      }, opts.body ? { "Content-Type": "application/json" } : {}, opts.prefer ? { "Prefer": opts.prefer } : {}),
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    if (!res.ok) {
      const text = await res.text().catch(() => "");
      lastError = "Request failed (" + res.status + "): " + text.slice(0, 300);
      return opts.method && opts.method !== "GET" ? null : [];
    }
    if (res.status === 204) return null;
    const text = await res.text();
    return text ? JSON.parse(text) : [];
  } catch (e) {
    lastError = "Network error: " + (e && e.message ? e.message : String(e));
    return opts.method && opts.method !== "GET" ? null : [];
  }
}

async function maybeAutoQueueVideo(topicId, subjectId){
  if (!topicId || !subjectId) return;
  try {
    const [progressRows, existingReqRows, templateRows] = await Promise.all([
      sb(`nlm_progress?select=resource_url&topic_id=eq.${topicId}&profile_id=eq.${PROFILE.id}&step_order=eq.2`),
      sb(`video_requests?select=status&topic_id=eq.${topicId}&profile_id=eq.${PROFILE.id}`),
      sb(`nlm_checklist_templates?select=actions&subject_id=eq.${subjectId}&title=eq.Video Overview`)
    ]);
    if (progressRows[0] && progressRows[0].resource_url) return;
    const existing = existingReqRows[0];
    if (existing && ["pending", "processing", "done"].includes(existing.status)) return;
    const tmpl = templateRows[0];
    if (!tmpl) return;
    const actions = Array.isArray(tmpl.actions) ? tmpl.actions : (typeof tmpl.actions === "string" ? JSON.parse(tmpl.actions) : []);
    if (actions.length !== 2) return;
    const promptText = (actions.find(a => a.type === "customize") || {}).text || "";
    if (!promptText) return;
    await sb("video_requests", {
      method: "POST",
      prefer: "resolution=merge-duplicates,return=minimal",
      body: [{ topic_id: topicId, profile_id: PROFILE.id, prompt_text: promptText, status: "pending", video_url: null, error_message: null, requested_at: new Date().toISOString(), completed_at: null }]
    });
  } catch(e) { /* best-effort — never block flagging on this */ }
}

function lowerFirst(s){
  return s ? s.charAt(0).toLowerCase() + s.slice(1) : s;
}

function actionHTML(a){
  if(a.type === "prompt" || a.type === "customize"){
    return `

        <summary>Show prompt <span class="chev">&#9660;</span></summary>
        <div class="prompt-box">
          <div class="prompt-text">${esc(a.text)}</div>
          <button class="copy-btn" data-text="${encodeURIComponent(a.text)}">Copy</button>
        </div>
      </details>`;
  }
  return `<div class="action"><p class="action-instruction" style="margin-bottom:0;">${esc(a.text)}</p></div>`;
}

async function renderChapter(){
  document.getElementById("view").innerHTML = `<div class="loading">Loading chapter…</div>`;

  const topicRows = await sb(`topics?select=id,title,notebook_url,subject_id,order_num&id=eq.${state.topicId}`);
  const topic = topicRows[0];
  // Subjects with more than one book (Religion 1 and 2) share a name and an exam date
  const groupName = t => String(t || "").replace(/\s*PolSoc$/i, "").replace(/\s+\d+$/, "").trim();
  const allSubjects = topic ? await sb(`subjects?select=id,title&user_id=eq.${PROFILE.id}`) : [];
  const mySubject = allSubjects.find(x => topic && x.id === topic.subject_id);
  const siblingIds = mySubject ? allSubjects.filter(x => groupName(x.title) === groupName(mySubject.title)).map(x => x.id) : (topic ? [topic.subject_id] : []);
  if (topic) topic.subject_title = mySubject ? groupName(mySubject.title) : "";

  const templateRowsAll = topic
    ? await sb(`nlm_checklist_templates?select=id,step_order,emoji,title,blurb,actions&subject_id=eq.${topic.subject_id}&order=step_order.asc`)
    : [];
  const disabledRows = topic
    ? await sb(`nlm_disabled_steps?select=template_id&profile_id=eq.${PROFILE.id}`)
    : [];
  const disabledSet = new Set(disabledRows.map(r => r.template_id));
  const templateRows = templateRowsAll.filter(r => !disabledSet.has(r.id));
  const PRACTICE_TITLES = ["Flashcards Review", "Quiz Yourself", "Exam Practice"];
  // Learn order: Video, Slides, Revision Guide first, then anything else in its usual order
  const LEARN_FIRST = ["Video Overview", "In-Depth Slide Deck", "Revision Guide"];
  const learnRank = t => { const i = LEARN_FIRST.indexOf(t.title); return i < 0 ? LEARN_FIRST.length : i; };
  const learnRows = templateRows.filter(t => !PRACTICE_TITLES.includes(t.title)).sort((a, b) => learnRank(a) - learnRank(b) || a.step_order - b.step_order);
  const extraRows = templateRows.filter(t => t.title === "Flashcards Review");
  // The exam practice sheet is a resource on Learn (shown last, not counted in Learn progress)
  const learnExtras = templateRows.filter(t => t.title === "Exam Practice");
  let knowStats = null;
  const progressRows = await sb(`nlm_progress?select=step_order,done,resource_url,duration_min&topic_id=eq.${state.topicId}&profile_id=eq.${PROFILE.id}`);
  const confidenceRows = await sb(`nlm_confidence?select=rating&topic_id=eq.${state.topicId}&profile_id=eq.${PROFILE.id}`);
  const flagRows = await sb(`topic_flags?select=flag_type,note&topic_id=eq.${state.topicId}&profile_id=eq.${PROFILE.id}`);
  const currentFlag = flagRows[0] ? { flagType: flagRows[0].flag_type, note: flagRows[0].note || "" } : { flagType: null, note: "" };

  const [statusRows, examRows] = topic ? await Promise.all([
    sb(`chapter_status?select=class_done_at,fresh_since&topic_id=eq.${state.topicId}&profile_id=eq.${PROFILE.id}`),
    sb(`exam_dates?select=label,exam_date&subject_id=in.(${siblingIds.join(",")})&profile_id=eq.${PROFILE.id}`)
  ]) : [[], []];
  let classDoneAt = statusRows[0] ? statusRows[0].class_done_at : null;
  let freshSince = statusRows[0] ? statusRows[0].fresh_since : null;
  let exam = examRows[0] || null;
  let chapterStats = null;

  const videoRequestRows = topic
    ? await sb(`video_requests?select=status,video_url,error_message&topic_id=eq.${state.topicId}&profile_id=eq.${PROFILE.id}`)
    : [];
  let videoRequest = videoRequestRows[0] || null;

  const doneMap = {};
  progressRows.forEach(r => { doneMap[r.step_order] = { done: !!r.done, resourceUrl: r.resource_url || "", duration: r.duration_min || null }; });
  const confidenceRating = confidenceRows[0] ? parseInt(confidenceRows[0].rating, 10) : null;

  const NAMES = { "Revision Guide": "Revision guide", "Video Overview": "Video", "In-Depth Slide Deck": "Slides", "Audio Recap": "Audio recap", "Mind Map": "Mind map", "Flashcards Review": "Flashcards", "Quiz Yourself": "NotebookLM quiz", "Exam Practice": "Past Papers - Analysis & Answers" };
  const NOTES = { "Revision Guide": "5 minute read", "Video Overview": "Watch the key ideas", "In-Depth Slide Deck": "Like a full class lesson", "Audio Recap": "Listen anywhere", "Mind Map": "See how it all connects", "Flashcards Review": "Quick recall, little and often", "Quiz Yourself": "A NotebookLM quiz on this chapter", "Exam Practice": "Past paper questions with model answers" };
  const VERB = { "Video Overview": "Watch", "Audio Recap": "Listen" };
  // Shown once he has opened it (opening counts; no checklist to tick)
  const DONEW = { "Video Overview": "Watched", "Revision Guide": "Read", "In-Depth Slide Deck": "Looked through", "Audio Recap": "Listened" };

  // Students only see materials that are ready (a link is saved, or already ticked)
  // Shown to the student if it has a link, or was ticked when the page opened (so unticking to redo it never hides it)
  const shownAtLoad = new Set(progressRows.filter(r => r.done).map(r => r.step_order));
  const isReady = t => { const e = doneMap[t.step_order] || {}; return !!(e.resourceUrl || e.done || shownAtLoad.has(t.step_order)); };
  const shownRows = rows => isParentMode() ? rows : rows.filter(t => isReady(t) || (t.title === "Video Overview" && videoRequest && (videoRequest.status === "pending" || videoRequest.status === "processing")));
  function totalSteps(){ return shownRows(learnRows).length; }
  function doneCount(){ return shownRows(learnRows).filter(t => (doneMap[t.step_order] || {}).done).length; }

  // Parent set-up for a material: prompts, pasting a link, making the video
  // Length in minutes, shown to the student (videos and slides)
  function durationHTML(t, entry){
    if (!["Video Overview", "In-Depth Slide Deck", "Audio Recap"].includes(t.title)) return "";
    return `<div class="link-form" style="margin-top:10px"><label style="font-size:14px;align-self:center">Length (minutes)</label><input type="number" min="1" max="180" inputmode="numeric" style="max-width:90px" value="${entry.duration || ""}" data-role="dur-input" /><button data-action="save-dur" data-step="${t.step_order}">Save</button></div>`;
  }
  function setupHTML(t, actions, entry, isAutoVideo){
    const vr = videoRequest;
    const isQueued = vr && (vr.status === "pending" || vr.status === "processing");
    const customize = encodeURIComponent((actions.find(a => a.type === "customize") || {}).text || "");
    if (isAutoVideo) {
      const status = isQueued
        ? "Queued. The video will be made next time the automation runs, and the link will appear here."
        : (vr && vr.status === "error") ? `Something went wrong last time${vr.error_message ? ": " + esc(vr.error_message) : "."} You can try again.`
        : entry.resourceUrl ? "" : "Make this chapter's video automatically.";
      return `<div class="action">${status ? `<p class="action-instruction" style="margin-bottom:10px;">${status}</p>` : ""}
        ${isQueued
          ? `<button class="make-video-btn queued" disabled>Queued</button><button class="cancel-video-btn" data-topic="${state.topicId}">Cancel request</button>`
          : `<button class="make-video-btn${entry.resourceUrl ? " secondary" : ""}" data-topic="${state.topicId}" data-prompt="${customize}">${entry.resourceUrl ? "Make another video" : "Make video"}</button>`}
        ${entry.resourceUrl ? `<button class="change-btn" data-step="${t.step_order}" data-action="change-link" style="margin-left:10px">Remove link</button>` : ""}</div>${entry.resourceUrl ? durationHTML(t, entry) : ""}`;
    }
    if (entry.resourceUrl) return `<button class="change-btn" data-step="${t.step_order}" data-action="change-link">Remove this link</button>${durationHTML(t, entry)}`;
    const leadAction = actions.find(a => a.type !== "prompt" && a.type !== "customize");
    const leadLine = leadAction ? `Not made yet. Open the NotebookLM notebook and ${lowerFirst(leadAction.text)}` : `Not made yet. Open the NotebookLM notebook and use the prompt below.`;
    return `<div class="actions" style="margin-top:0">
        <div class="action"><p class="action-instruction" style="margin-bottom:10px;">${esc(leadLine)}</p></div>
        ${actions.filter(a => a.type === "prompt" || a.type === "customize").map(a => actionHTML(a)).join("")}
      </div>
      <div class="link-form" data-step="${t.step_order}">
        <input type="url" placeholder="Paste the link to what you made" data-role="link-input" />
        <button data-action="save-link" data-step="${t.step_order}">Save link</button>
      </div>`;
  }

  function stepHTML(t){
    const actions = Array.isArray(t.actions) ? t.actions : (typeof t.actions === "string" ? JSON.parse(t.actions) : []);
    const entry = doneMap[t.step_order] || { done: false, resourceUrl: "" };
    const isDone = entry.done;
    const isAutoVideo = t.title === "Video Overview" && actions.length === 2;
    const vr = videoRequest;
    const isQueued = vr && (vr.status === "pending" || vr.status === "processing");
    const name = NAMES[t.title] || t.title;
    const note = (NOTES[t.title] || t.blurb || "") + (entry.duration ? ` · ${entry.duration} min` : "");
    let btn;
    if (entry.resourceUrl) btn = `<a class="cv-btn" href="${esc(entry.resourceUrl)}" target="_blank" rel="noopener" data-open-step="${t.step_order}">${VERB[t.title] || "Open"}${isDone ? " again" : ""}</a>`;
    else if (isAutoVideo && isQueued) btn = `<span class="cv-wait">Being made</span>`;
    else btn = isParentMode() ? `<span class="cv-wait">Not ready yet</span>` : "";
    return `
      <div class="cv-row${isDone ? " done" : ""}">
        <div class="cv-item">
          ${isParentMode() ? `<button type="button" class="check cv-check" data-step="${t.step_order}" data-done="${isDone}" aria-pressed="${isDone}" aria-label="${isDone ? "Mark " + esc(name) + " as not done" : "Mark " + esc(name) + " as done"}">&#10003;</button>` : ""}
          <div class="cv-item-body"><span class="cv-item-title">${esc(name)}${isDone ? `<span class="cv-seen">&#10003; ${esc(DONEW[t.title] || "Done")}</span>` : ""}</span><span class="cv-item-sub">${esc(note)}</span></div>
          ${btn}
        </div>
        ${isParentMode() ? `<details class="cv-setup"><summary>${entry.resourceUrl && !isAutoVideo ? "Change" : "Set up"}</summary><div class="cv-setup-body">${setupHTML(t, actions, entry, isAutoVideo)}</div></details>` : ""}
      </div>`;
  }

  let practiceApi = null;
  function updateProgressUI(){
    paintClassFoot();
    paintTabs();
  }
  function stageInfo(){
    return Stages.chapterStage({ learnDone: doneCount(), learnTotal: totalSteps(), classDone: !!classDoneAt, freshSince, exam, stats: chapterStats || {} });
  }
  function paintTabs(){
    const info = stageInfo();
    const set = (k, icon, sub, now) => {
      const b = document.getElementById("tabbtn-" + k); if (!b) return;
      b.querySelector(".cv-tab-i").innerHTML = icon === "tick" ? `<span class="cv-tick" aria-hidden="true">&#10003;</span>` : icon === "now" ? `<span class="cv-now" aria-hidden="true"></span>` : "";
      const se = b.querySelector(".cv-tab-s"); se.textContent = sub; se.classList.toggle("now", !!now);
    };
    const learnDoneAll = info.learnTotal > 0 && info.learnDone >= info.learnTotal;
    if (info.stage === "learn" || info.stage === "none") set("learn", learnDoneAll ? "tick" : "now", "Watch & read", !learnDoneAll);
    else set("learn", learnDoneAll ? "tick" : "", "Watch & read" + (learnDoneAll ? " · done" : ""), false);
    if (info.stage === "test") set("test", info.done ? "tick" : "now", "Check yourself", !info.done);
    else if (info.tested || (info.stage === "refresh" && (info.stats.triedEver || 0) >= Math.ceil((info.stats.total || 1) * 0.8))) set("test", "tick", "Check yourself", false);
    else set("test", "", "Check yourself", false);
    const st = info.stats || {}, nPast = st.pastTotal || 0, nEx = st.examTotal || 0;
    const prepSub = nPast ? `${nPast} exam question${nPast === 1 ? "" : "s"}` : nEx ? `${nEx} exam question${nEx === 1 ? "" : "s"}` : "Past papers";
    if (info.stage === "refresh") set("refresh", info.done ? "tick" : "now", info.done ? "Exam ready" : "Exams soon", !info.done);
    else set("refresh", "", prepSub, false);
    return info;
  }
  function paintClassFoot(){
    const el = document.getElementById("classFoot"); if (!el) return;
    el.innerHTML = `<span>Ready? See what you know.</span><button type="button" class="cv-btn" data-goto2="test">Check what you know</button>`;
    el.querySelector("[data-goto2]").onclick = () => goTab("test");
    const first = document.querySelector(".cv-first"); if (first) first.onclick = () => goTab("test");
  }


  function bindStepEvents(){
    ["stepsContainer", "stepsContainer2"].forEach(cid => bindStepsIn(document.getElementById(cid)));
  }
  function bindStepsIn(stepsEl){
    if (!stepsEl) return;

    stepsEl.querySelectorAll("[data-expand]").forEach(el => {
      el.addEventListener("click", () => {
        state.expandedStep = parseInt(el.dataset.expand, 10);
        refreshSteps();
      });
    });

    stepsEl.querySelectorAll("[data-skip-to]").forEach(el => {
      el.addEventListener("click", (ev) => {
        ev.stopPropagation();
        state.expandedStep = parseInt(el.dataset.skipTo, 10);
        refreshSteps();
      });
    });

    stepsEl.querySelectorAll(".check").forEach(el => {
      el.addEventListener("click", async (ev) => {
        ev.stopPropagation();
        const step = parseInt(el.dataset.step, 10);
        const newDone = el.dataset.done !== "true";
        doneMap[step] = doneMap[step] || { done: false, resourceUrl: "" };
        doneMap[step].done = newDone;
        el.dataset.done = String(newDone);
        if (newDone) el.classList.add("just-checked");
        refreshSteps();
        await sb("nlm_progress?on_conflict=topic_id,profile_id,step_order", {
          method: "POST",
          prefer: "resolution=merge-duplicates,return=minimal",
          body: [{ topic_id: state.topicId, profile_id: PROFILE.id, step_order: step, done: newDone, updated_at: new Date().toISOString() }]
        });
      });
    });

    stepsEl.querySelectorAll('[data-action="save-link"]').forEach(btn => {
      btn.addEventListener("click", async () => {
        const step = parseInt(btn.dataset.step, 10);
        const form = btn.closest(".link-form");
        const input = form.querySelector('[data-role="link-input"]');
        const url = (input.value || "").trim();
        if (!url) return;
        btn.disabled = true;
        btn.textContent = "Saving...";
        await sb("nlm_progress?on_conflict=topic_id,profile_id,step_order", {
          method: "POST",
          prefer: "resolution=merge-duplicates,return=minimal",
          body: [{ topic_id: state.topicId, profile_id: PROFILE.id, step_order: step, resource_url: url, updated_at: new Date().toISOString() }]
        });
        doneMap[step] = doneMap[step] || { done: false, resourceUrl: "" };
        doneMap[step].resourceUrl = url;
        refreshSteps();
      });
    });

    stepsEl.querySelectorAll("[data-open-step]").forEach(a => {
      a.addEventListener("click", () => {
        const step = parseInt(a.dataset.openStep, 10);
        if ((doneMap[step] || {}).done) return;
        doneMap[step] = doneMap[step] || { done: false, resourceUrl: "" };
        doneMap[step].done = true;
        sb("nlm_progress?on_conflict=topic_id,profile_id,step_order", { method: "POST", prefer: "resolution=merge-duplicates,return=minimal",
          body: [{ topic_id: state.topicId, profile_id: PROFILE.id, step_order: step, done: true, updated_at: new Date().toISOString() }] });
        setTimeout(refreshSteps, 400);
      });
    });

    stepsEl.querySelectorAll('[data-action="save-dur"]').forEach(btn => {
      btn.addEventListener("click", async () => {
        const step = parseInt(btn.dataset.step, 10);
        const v = parseInt(btn.closest(".link-form").querySelector('[data-role="dur-input"]').value, 10);
        const mins = v > 0 && v <= 180 ? v : null;
        btn.disabled = true; btn.textContent = "Saving...";
        await sb("nlm_progress?on_conflict=topic_id,profile_id,step_order", { method: "POST", prefer: "resolution=merge-duplicates,return=minimal",
          body: [{ topic_id: state.topicId, profile_id: PROFILE.id, step_order: step, duration_min: mins, updated_at: new Date().toISOString() }] });
        doneMap[step] = doneMap[step] || { done: false, resourceUrl: "" };
        doneMap[step].duration = mins;
        refreshSteps();
      });
    });

    stepsEl.querySelectorAll('[data-action="change-link"]').forEach(btn => {
      btn.addEventListener("click", async () => {
        const step = parseInt(btn.dataset.step, 10);
        await sb(`nlm_progress?topic_id=eq.${state.topicId}&profile_id=eq.${PROFILE.id}&step_order=eq.${step}`, {
          method: "PATCH",
          prefer: "return=minimal",
          body: { resource_url: null, updated_at: new Date().toISOString() }
        });
        if (doneMap[step]) doneMap[step].resourceUrl = "";
        refreshSteps();
      });
    });

    stepsEl.querySelectorAll(".copy-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        const text = decodeURIComponent(btn.dataset.text);
        try{ await navigator.clipboard.writeText(text); }
        catch(e){
          const ta = document.createElement("textarea");
          ta.value = text; document.body.appendChild(ta); ta.select();
          document.execCommand("copy"); document.body.removeChild(ta);
        }
        btn.textContent = "Copied!"; btn.classList.add("copied");
        setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("copied"); }, 1300);
      });
    });

    stepsEl.querySelectorAll(".make-video-btn:not(.queued)").forEach(btn => {
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        btn.textContent = "Queuing...";
        const topicId = btn.dataset.topic;
        const promptText = decodeURIComponent(btn.dataset.prompt || "");
        await sb("video_requests", {
          method: "POST",
          prefer: "resolution=merge-duplicates,return=minimal",
          body: [{ topic_id: topicId, profile_id: PROFILE.id, prompt_text: promptText, status: "pending", video_url: null, error_message: null, requested_at: new Date().toISOString(), completed_at: null }]
        });
        videoRequest = { status: "pending", video_url: null, error_message: null };
        refreshSteps();
      });
    });

    stepsEl.querySelectorAll(".cancel-video-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        btn.disabled = true;
        const topicId = btn.dataset.topic;
        await sb(`video_requests?topic_id=eq.${topicId}&profile_id=eq.${PROFILE.id}`, {
          method: "DELETE",
          prefer: "return=minimal"
        });
        videoRequest = null;
        refreshSteps();
      });
    });
  }

  function refreshSteps(){
    const stepsEl = document.getElementById("stepsContainer");
    if (!stepsEl) return;
    const visible = shownRows(learnRows.concat(learnExtras));
    stepsEl.innerHTML = visible.length ? visible.map(t => stepHTML(t)).join("") : `<p class="cv-empty">The videos and notes for this chapter are on their way. You can still test yourself in Quick Tests.</p>`;
    const extraEl = document.getElementById("stepsContainer2"), extraBox = document.getElementById("extraPractice");
    if (extraEl) extraEl.innerHTML = extraRows.map(t => stepHTML(t)).join("");
    if (extraBox && !extraRows.length && !(document.getElementById("rightSlot") || {}).childElementCount) extraBox.hidden = true;
    bindStepEvents();
    updateProgressUI();
  }

  const TABS = [["learn", "Learn"], ["test", "Quick Tests"], ["refresh", "Exam Prep"]];
  // Open on the step he's at (worked out again once the questions have loaded)
  let autoTab = false;
  if (!state.chapterTab || state.chapterTabTopic !== state.topicId) {
    state.chapterTab = "learn";
    state.chapterTabTopic = state.topicId;
    autoTab = true;
  }

  document.getElementById("view").innerHTML = `
  <div class="cv">
    <div class="crumb"><span id="backBtn" role="button" tabindex="0">&larr; ${esc(topic && topic.subject_title ? topic.subject_title : "Back to subjects")}</span></div>
    <h2 class="cv-title">${esc(topic ? topic.title : "")}</h2>
    <div class="cv-meta">
      <button type="button" class="cv-flag${currentFlag.flagType ? " active" : ""}" id="chapFlagToggle">${currentFlag.flagType ? "&check; On my revision list" : "+ Add to revision list"}</button>
    </div>
    ${currentFlag.flagType ? `
      <div class="flag-note-row">
        <input type="text" id="chapNoteInput" placeholder="Add a note, e.g. test on Tue 29/09" value="${esc(currentFlag.note)}" />
        <button id="chapNoteSave">Save</button>
      </div>` : ""}
    <div class="cv-tabs" role="tablist" aria-label="Chapter sections">
      ${TABS.map(([k, l]) => `<button type="button" role="tab" class="cv-tab" id="tabbtn-${k}" data-tab="${k}" aria-controls="tab-${k}"><span class="cv-tab-l"><span class="cv-tab-i"></span>${l}</span><span class="cv-tab-s"></span></button>`).join("")}
    </div>

    <section id="tab-learn" role="tabpanel" aria-labelledby="tabbtn-learn" hidden>
      <div class="cv-tip"><b>Tip:</b> Watching the video or reading the revision guide before a topic is taught in class gives you a head start, so the lesson makes more sense. Going over them again afterwards helps it stick.</div>
      <button type="button" class="cv-card cv-first" data-goto2="test"><span><b>Already know some of this?</b> You can test yourself first.</span><span class="cv-first-go">Check what you know &rsaquo;</span></button>
      <div class="cv-card cv-list" id="stepsContainer"></div>
      <div class="cv-card cv-foot" id="classFoot"></div>
    </section>

    <section id="tab-test" role="tabpanel" aria-labelledby="tabbtn-test" hidden>
      <div id="practiceSlot"><div class="cv-card cv-empty">Quizzes for this chapter are coming soon. Use the extra practice below for now.</div></div>
      <div class="pr-pair" id="pairRow"><div id="paperSlot"></div><div id="tutorSlot"></div></div>
      <div id="practiceMoreSlot"></div>
    </section>

    <section id="tab-refresh" role="tabpanel" aria-labelledby="tabbtn-refresh" hidden>
      <div id="examSlot"></div>
      <div id="prepSlot"><div class="cv-card cv-empty">Exam questions for this chapter are coming soon.</div></div>
      <div id="refreshSlot"></div>
      <button type="button" class="cv-back-learn" id="prepBackLearn" data-goto="learn">Need a reminder first? Go back to Learn &rsaquo;</button>
    </section>
  </div>
  `;

  function showTab(name){
    state.chapterTab = name;
    TABS.forEach(([k]) => {
      const p = document.getElementById("tab-" + k), b = document.getElementById("tabbtn-" + k);
      if (p) p.hidden = k !== name;
      if (b) { b.setAttribute("aria-selected", String(k === name)); b.tabIndex = k === name ? 0 : -1; }
    });
  }
  document.querySelectorAll(".cv-tab").forEach((b, i, all) => {
    b.addEventListener("click", () => showTab(b.dataset.tab));
    b.addEventListener("keydown", (e) => {
      if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
      const n = all[(i + (e.key === "ArrowRight" ? 1 : all.length - 1)) % all.length];
      n.focus(); showTab(n.dataset.tab);
    });
  });
  const goTab = (t) => { showTab(t); const tabs = document.querySelector(".cv-tabs"); if (tabs) tabs.scrollIntoView({ block: "start", behavior: "smooth" }); };
  document.querySelectorAll("[data-goto]").forEach(b => b.addEventListener("click", () => goTab(b.dataset.goto)));
  showTab(state.chapterTab);
  document.querySelectorAll(".cv-tab").forEach(b => b.addEventListener("click", () => { autoTab = false; }));

  if (topic) Stages.examBox(document.getElementById("examSlot"), { sb, profile: PROFILE, subjectId: topic.subject_id, subjectIds: siblingIds, exam, onChange: (e) => { exam = e; paintTabs(); if (practiceApi) practiceApi.refresh(); } });

  if (topic && window.mountPractice) window.mountPractice(document.getElementById("practiceSlot"), {
    topic, profile: PROFILE, sb,
    moreSlot: document.getElementById("practiceMoreSlot"),
    paperSlot: document.getElementById("paperSlot"),
    refreshSlot: document.getElementById("refreshSlot"),
    prepSlot: document.getElementById("prepSlot"),
    prepHide: [document.getElementById("examSlot"), document.getElementById("refreshSlot"), document.getElementById("prepBackLearn")],
    rightSlot: document.getElementById("rightSlot"),
    freshSince: () => freshSince,
    goTo: goTab,
    onStats: (st) => {
      chapterStats = st;
      const info = paintTabs();
      if (autoTab) { autoTab = false; const t = { learn: "learn", none: "learn", test: "test", refresh: "refresh" }[info.stage]; if (t !== state.chapterTab) showTab(t); }
    },
    onStartFresh: async () => { freshSince = new Date().toISOString(); await Stages.startFresh(sb, PROFILE, state.topicId); },
    hideDuring: [document.getElementById("pairRow"), document.getElementById("practiceMoreSlot"), document.getElementById("extraPractice")],
    dailyGoal: Stages.DAILY_GOAL,
    goHome,
    // After a chapter in "today's 30 minutes": the next chapter to carry on with
    nextUp: async (excludeId) => {
      const { model } = await loadModel(); state.model = model;
      const n = Stages.nextUp(model, excludeId); if (!n) return null;
      const c = n.c, subj = (model.bySubject[c.subject_id] || {}).title || "";
      return { id: c.id, subject_id: c.subject_id, why: n.why, left: c.stats.quickLeft, when: c.stats.lastAt ? Stages.ago(c.stats.lastAt) : "",
        title: `${n.why === "unfinished" ? "Finish " : ""}${subj}${c.book ? " " + c.book : ""} · Ch ${c.order_num ?? ""}: ${String(c.title).replace(/^Ch\s*\d+\s*:\s*/i, "")}` };
    },
    // After a round, when today's session has another item: go to it
    sessionNext: async (currentId) => {
      const { model } = await loadModel(); state.model = model;
      const n = Stages.sessionNext(model, PROFILE, currentId); if (!n) return null;
      return { id: n.c.id, subject_id: n.c.subject_id, tab: n.tab, why: "session", left: (n.c.stats || {}).quickLeft || 0, title: n.title, note: n.note, keep: "Next" };
    },
    openToday: (n) => { if (n.tab && n.tab !== "test") { openChapter(n.id, n.subject_id, n.tab); return; } state.todayRun = n.id; openChapter(n.id, n.subject_id, "test"); }
  }).then(api => {
    practiceApi = api;
    if (api && state.todayRun === state.topicId) { state.todayRun = null; autoTab = false; api.runToday(); }
    if (api && state.memoryRun && state.memoryRun.topic === state.topicId) { const r = state.memoryRun; state.memoryRun = null; autoTab = false; api.runMemory(r.qid, r.origin, r.days); }
    if (!api && autoTab) { autoTab = false; paintTabs(); }
  });
  if (topic && window.mountTutor) window.mountTutor(document.getElementById("tutorSlot"), { topic, profile: PROFILE, sb });

  const backBtn = document.getElementById("backBtn");
  const goBack = () => { state.view = "subject"; render(); window.scrollTo({ top: 0 }); };
  backBtn.addEventListener("click", goBack);
  backBtn.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); goBack(); } });

  async function setChapterFlag(){
    const isActive = !!currentFlag.flagType;
    if (isActive) {
      await sb(`topic_flags?topic_id=eq.${state.topicId}&profile_id=eq.${PROFILE.id}`, {
        method: "DELETE",
        prefer: "return=minimal"
      });
      renderChapter();
    } else {
      await sb("topic_flags", {
        method: "POST",
        prefer: "resolution=merge-duplicates,return=minimal",
        body: [{ topic_id: state.topicId, profile_id: PROFILE.id, flag_type: "revise", updated_at: new Date().toISOString() }]
      });
      if (topic) maybeAutoQueueVideo(state.topicId, topic.subject_id);
      state.view = "dashboard";
      await renderDashboard();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  }

  const chapFlagToggle = document.getElementById("chapFlagToggle");
  if (chapFlagToggle) chapFlagToggle.addEventListener("click", () => setChapterFlag());

  const chapNoteSave = document.getElementById("chapNoteSave");
  if (chapNoteSave) {
    chapNoteSave.addEventListener("click", async () => {
      const input = document.getElementById("chapNoteInput");
      const note = (input.value || "").trim();
      chapNoteSave.disabled = true;
      chapNoteSave.textContent = "Saving...";
      await sb(`topic_flags?topic_id=eq.${state.topicId}&profile_id=eq.${PROFILE.id}`, {
        method: "PATCH",
        prefer: "return=minimal",
        body: { note: note, updated_at: new Date().toISOString() }
      });
      chapNoteSave.disabled = false;
      chapNoteSave.textContent = "Saved!";
      setTimeout(() => { chapNoteSave.textContent = "Save"; }, 1200);
    });
  }

  observeReveal(".confidence-card");
  refreshSteps();

  const confSlider = document.getElementById("confSlider");
  const confValue = document.getElementById("confValue");
  const confSaved = document.getElementById("confSaved");
  if (confSlider) {
    confSlider.addEventListener("input", () => {
      confValue.textContent = confSlider.value;
    });
    confSlider.addEventListener("change", async () => {
      await sb("nlm_confidence", {
        method: "POST",
        prefer: "resolution=merge-duplicates,return=minimal",
        body: [{ topic_id: state.topicId, profile_id: PROFILE.id, rating: parseInt(confSlider.value, 10), updated_at: new Date().toISOString() }]
      });
      confSaved.classList.add("show");
      setTimeout(() => confSaved.classList.remove("show"), 1500);
    });
  }
}

async function renderSettings(){
  document.getElementById("view").innerHTML = `<div class="loading">Loading settings…</div>`;

  const subjects = await sb(`subjects?select=id,title&user_id=eq.${PROFILE.id}&order=title.asc`);
  const subjectIds = subjects.map(s => s.id);
  const templateRows = subjectIds.length
    ? await sb(`nlm_checklist_templates?select=id,subject_id,step_order,emoji,title,blurb&subject_id=in.${inList(subjectIds)}&order=step_order.asc`)
    : [];
  const disabledRows = await sb(`nlm_disabled_steps?select=template_id&profile_id=eq.${PROFILE.id}`);
  const disabledSet = new Set(disabledRows.map(r => r.template_id));

  const bySubject = {};
  subjects.forEach(s => { bySubject[s.id] = { title: s.title, steps: [] }; });
  templateRows.forEach(t => { if (bySubject[t.subject_id]) bySubject[t.subject_id].steps.push(t); });

  const th = window.Theme ? Theme.get() : { accent: "green", mode: "light" };
  const NAMES = { green: "Green", blue: "Blue", purple: "Purple" };
  const parent = !!state.parentSetup;
  const tasksHtml = `
    <p class="settings-hint">Choose which learning materials ${esc(PROFILE.name)} sees for each subject, like skipping the audio overview. Turned-off materials won't count toward progress.</p>
    ${subjectIds.length === 0 ? `<div class="empty">No subjects yet.</div>` : subjects.map(s => {
      const steps = bySubject[s.id].steps;
      return `
        <div class="settings-subject">
          <h3>${esc(s.title)}</h3>
          <p class="sub">${steps.length} ${steps.length === 1 ? "material" : "materials"}</p>
          ${steps.map(t => {
            const enabled = !disabledSet.has(t.id);
            return `
              <div class="settings-step-row">
                <span class="settings-step-emoji">${t.emoji || ""}</span>
                <div class="settings-step-body">
                  <div class="settings-step-title${enabled ? "" : " disabled"}">${esc(t.title)}</div>
                  <div class="settings-step-blurb">${esc(t.blurb || "")}</div>
                </div>
                <button class="settings-toggle ${enabled ? "on" : ""}" data-template="${t.id}" aria-label="Toggle ${esc(t.title)}"><span class="knob"></span></button>
              </div>`;
          }).join("")}
        </div>`;
    }).join("")}`;
  const html = parent ? `
    <div class="crumb"><span id="settingsBack">&larr; Settings</span></div>
    <div class="section-head"><h2 class="section-title">Parent set-up</h2></div>
    <div class="settings-subject"><h3>Set-up buttons</h3>
      <div class="settings-step-row"><div class="settings-step-body"><div class="settings-step-title">Show set-up buttons on chapter pages</div>
        <div class="settings-step-blurb">For adding links to videos, slides and guides. Only on this device, so ${esc(PROFILE.name)} doesn't see them on theirs.</div></div>
        <button class="settings-toggle ${isParentMode() ? "on" : ""}" id="parentModeToggle" aria-label="Show set-up buttons"><span class="knob"></span></button></div></div>
    <div id="voiceCard"></div>
    ${tasksHtml}` : `
    <div class="crumb"><span id="settingsBack">&larr; Home</span></div>
    <div class="section-head"><h2 class="section-title">Settings</h2></div>
    ${window.Theme ? `<div class="look-card">
      <div class="look-row"><div><b>Colour</b><span>Used for buttons, ticks and highlights</span></div>
        <div class="look-swatches" role="radiogroup" aria-label="Colour">${Theme.ACCENTS.map(a => `<button type="button" class="look-swatch" role="radio" aria-checked="${th.accent === a}" data-accent="${a}"><i style="background:${Theme.swatch(a)}"></i>${NAMES[a]}</button>`).join("")}</div></div>
      <div class="look-row"><div><b>Screen</b><span>Dark is easier on the eyes at night</span></div>
        <div class="look-seg" role="radiogroup" aria-label="Screen">${["light","dark"].map(m => `<button type="button" role="radio" aria-checked="${th.mode === m}" data-mode="${m}">${m === "light" ? "Light" : "Dark"}</button>`).join("")}</div></div>
    </div>` : ""}
    <div id="myPage"></div>
    <button type="button" class="parent-link" id="parentSetup">Parent set-up: materials and voice tutor time &rsaquo;</button>
  `;
  document.getElementById("view").innerHTML = html;

  document.querySelectorAll(".look-swatch").forEach(b => b.addEventListener("click", async () => {
    document.querySelectorAll(".look-swatch").forEach(x => x.setAttribute("aria-checked", String(x === b)));
    await Theme.set(sb, { accent: b.dataset.accent });
  }));
  document.querySelectorAll(".look-seg [data-mode]").forEach(b => b.addEventListener("click", async () => {
    document.querySelectorAll(".look-seg [data-mode]").forEach(x => x.setAttribute("aria-checked", String(x === b)));
    await Theme.set(sb, { mode: b.dataset.mode });
  }));
  const mp = document.getElementById("myPage");
  if (mp && window.Decor && !parent) {
    const mdl = state.model || (await loadModel()).model;
    state.model = mdl;
    if (mp.isConnected) Decor.panel(mp, { sb, goal: mdl.goal });
  }
  const pmt = document.getElementById("parentModeToggle");
  if (pmt) pmt.addEventListener("click", () => { const on = !isParentMode(); try { localStorage.setItem(PARENT_KEY, on ? "1" : "0"); } catch (e) {} pmt.classList.toggle("on", on); });
  if (parent && window.TutorLimits) TutorLimits.voicePanel(document.getElementById("voiceCard"), { sb, profile: PROFILE });
  const ps = document.getElementById("parentSetup");
  if (ps) ps.addEventListener("click", () => { state.parentSetup = true; renderSettings(); window.scrollTo({ top: 0 }); });
  document.getElementById("settingsBack").addEventListener("click", () => {
    if (state.parentSetup) { state.parentSetup = false; renderSettings(); return; }
    state.view = "dashboard";
    render();
  });

  document.querySelectorAll(".settings-toggle[data-template]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const templateId = btn.dataset.template;
      const isOn = btn.classList.contains("on");
      btn.disabled = true;
      if (isOn) {
        await sb("nlm_disabled_steps", {
          method: "POST",
          prefer: "resolution=merge-duplicates,return=minimal",
          body: [{ template_id: templateId, profile_id: PROFILE.id }]
        });
      } else {
        await sb(`nlm_disabled_steps?template_id=eq.${templateId}&profile_id=eq.${PROFILE.id}`, {
          method: "DELETE",
          prefer: "return=minimal"
        });
      }
      btn.disabled = false;
      btn.classList.toggle("on");
      const titleEl = btn.closest(".settings-step-row").querySelector(".settings-step-title");
      titleEl.classList.toggle("disabled");
    });
  });
}

function render(){
  if(state.view === "chapter") { renderChapter(); return; }
  if(state.view === "settings") { renderSettings(); return; }
  if(state.view === "subject") { renderSubjectPage(); return; }
  renderDashboard();
}

const settingsBtn = document.getElementById("settingsBtn");
if (settingsBtn) {
  settingsBtn.addEventListener("click", () => {
    state.view = "settings"; state.parentSetup = false;
    render();
  });
}

render();
if (window.Theme) Theme.load(sb);
if (window.Decor) Decor.load(sb);
</script>
</body>
</html>
